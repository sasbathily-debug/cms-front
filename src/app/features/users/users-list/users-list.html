<div class="mx-auto max-w-3xl p-8">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-xl font-semibold text-gray-900">Utilisateurs</h1>
    <button (click)="logout()" class="text-sm text-gray-500 hover:text-gray-800">
      Déconnexion
    </button>
  </div>

  @if (loading()) {
    <table class="w-full overflow-hidden rounded-none bg-surface text-left text-sm shadow">
      <thead class="bg-gray-100 text-gray-600">
        <tr>
          <th class="px-4 py-2">Email</th>
          <th class="px-4 py-2">Nom</th>
          <th class="px-4 py-2">Rôle</th>
        </tr>
      </thead>
      <tbody>
        @for (i of [0, 1, 2, 3]; track i) {
          <tr class="border-t border-gray-100">
            <td class="px-4 py-2"><div class="skeleton h-3.5 w-40 rounded"></div></td>
            <td class="px-4 py-2"><div class="skeleton h-3.5 w-28 rounded"></div></td>
            <td class="px-4 py-2"><div class="skeleton h-3.5 w-16 rounded"></div></td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <table class="w-full overflow-hidden rounded-none bg-surface text-left text-sm shadow">
      <thead class="bg-gray-100 text-gray-600">
        <tr>
          <th class="px-4 py-2">Email</th>
          <th class="px-4 py-2">Nom</th>
          <th class="px-4 py-2">Rôle</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr class="border-t border-gray-100">
            <td class="px-4 py-2">{{ user.email }}</td>
            <td class="px-4 py-2">{{ user.firstName }} {{ user.lastName }}</td>
            <td class="px-4 py-2">{{ user.role }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
