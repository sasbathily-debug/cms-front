<div class="flex min-h-screen items-center justify-center bg-cream-50 px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-forest-900">
        <img src="/logo/logo-icon-light.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
      </div>
      <div>
        <h1
          class="font-display text-[1.7rem] font-bold leading-tight tracking-[-0.02em] text-forest-900"
        >
          Vérifiez votre email
        </h1>
        <p class="text-sm text-ink-600">Code envoyé à {{ email() }}</p>
      </div>
    </div>

    <app-auth-steps [step]="2" />

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="space-y-4 rounded-3xl border border-border-warm bg-white p-6 sm:p-8"
    >
      <div>
        <label for="verify-otp-otp" class="mb-1.5 block text-sm font-medium text-ink-900"
          >Code de vérification</label
        >
        <input
          id="verify-otp-otp"
          type="text"
          inputmode="numeric"
          maxlength="6"
          formControlName="otp"
          placeholder="123456"
          class="w-full rounded-[14px] border-[1.5px] border-border-warm px-4 py-3.5 text-center text-xl tracking-[0.3em] text-ink-900 focus:border-accent-500 focus:outline-none focus:ring-4 focus:ring-accent-500/20"
        />
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-600">{{ errorMessage() }}</p>
      }
      @if (resendMessage()) {
        <p class="text-sm text-forest-800">{{ resendMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="form.invalid || loading()"
        class="w-full rounded-full bg-accent-500 px-4 py-4 font-display text-base font-bold text-forest-900 transition hover:bg-accent-600 disabled:opacity-50"
      >
        {{ loading() ? 'Vérification...' : 'Confirmer' }}
      </button>

      <button
        type="button"
        (click)="resend()"
        class="w-full text-center text-sm font-semibold text-accent-800 hover:underline"
      >
        Renvoyer le code
      </button>
    </form>
  </div>
</div>
