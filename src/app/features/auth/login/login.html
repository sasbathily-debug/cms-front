<div class="grid min-h-screen bg-cream-50 lg:grid-cols-2">
  <app-auth-visual-panel />

  <div class="relative flex items-center justify-center px-4 py-12 sm:px-6">
    <a
      routerLink="/"
      class="absolute right-5 top-6 text-sm font-semibold text-[#4A3F49] hover:text-forest-900 sm:right-10 sm:top-8"
      >← Retour à l'accueil</a
    >
    <div class="w-full max-w-sm">
      <div class="mb-10 flex flex-col items-center gap-3 text-center lg:items-start lg:text-left">
        <div
          class="flex h-12 w-12 items-center justify-center rounded-full bg-forest-900 lg:hidden"
        >
          <img src="/logo/logo-icon-light.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
        </div>
        <div>
          <h1
            class="font-display text-[2rem] font-bold leading-tight tracking-[-0.02em] text-forest-900"
          >
            Content de vous revoir
          </h1>
          <p class="mt-1 text-sm text-ink-600">Connectez-vous à votre espace patient</p>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <div>
          <label for="login-identifier" class="mb-2 block text-sm font-semibold text-forest-900"
            >Email ou téléphone</label
          >
          <input
            id="login-identifier"
            type="text"
            formControlName="identifier"
            autocomplete="username"
            placeholder="vous@exemple.com ou 77 000 00 00"
            class="w-full rounded-[14px] border-[1.5px] border-border-warm bg-white px-4 py-3.5 text-base text-ink-900 transition focus:border-accent-500 focus:outline-none focus:ring-4 focus:ring-accent-500/20"
          />
        </div>

        <div>
          <label for="login-password" class="mb-2 block text-sm font-semibold text-forest-900"
            >Mot de passe</label
          >
          <input
            id="login-password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="w-full rounded-[14px] border-[1.5px] border-border-warm bg-white px-4 py-3.5 text-base text-ink-900 transition focus:border-accent-500 focus:outline-none focus:ring-4 focus:ring-accent-500/20"
          />
        </div>

        @if (errorMessage()) {
          <p class="rounded-lg bg-red-50 px-3.5 py-2.5 text-sm text-red-600">
            {{ errorMessage() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="form.invalid || loading()"
          class="w-full rounded-full bg-accent-500 px-4 py-4 font-display text-base font-bold text-forest-900 transition hover:bg-accent-600 disabled:opacity-50"
        >
          {{ loading() ? 'Connexion...' : 'Se connecter' }}
        </button>

        <p class="text-center text-sm text-ink-600">
          Pas encore de compte ?
          <a
            routerLink="/register"
            [queryParams]="returnUrl ? { returnUrl } : {}"
            class="font-semibold text-accent-800 hover:underline"
            >Créer un compte</a
          >
        </p>
      </form>
    </div>
  </div>
</div>
