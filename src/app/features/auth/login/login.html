<div class="grid min-h-screen bg-cream-50 lg:grid-cols-2">
  <app-auth-visual-panel />

  <div class="relative flex items-center justify-center px-4 py-14 sm:px-10">
    <a
      routerLink="/"
      class="absolute right-5 top-6 text-[14.5px] font-semibold text-[#4A3F49] hover:text-forest-900 sm:right-10 sm:top-8"
      >← Retour à l'accueil</a
    >

    <div class="flex w-full max-w-[440px] flex-col gap-[26px]">
      <a
        routerLink="/"
        class="flex h-12 w-12 items-center justify-center rounded-full bg-forest-900 lg:hidden"
      >
        <img src="/logo/logo-icon-light.png" alt="Accueil" class="h-2/3 w-2/3 object-contain" />
      </a>

      <div class="flex flex-col gap-2">
        <h1
          class="m-0 font-display text-[34px] font-bold leading-[1.1] tracking-[-0.025em] text-forest-900"
        >
          Content de vous revoir
        </h1>
        <p class="m-0 text-base leading-[1.55] text-[#4A3F49]">
          Connectez-vous pour réserver et suivre vos rendez-vous.
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-[26px]">
        <div class="flex flex-col gap-2">
          <label for="login-identifier" class="text-[14.5px] font-semibold text-forest-900"
            >Téléphone ou e-mail</label
          >
          <input
            id="login-identifier"
            type="text"
            formControlName="identifier"
            autocomplete="username"
            placeholder="77 000 00 00 ou vous@exemple.com"
            class="rounded-[14px] border-[1.5px] border-[#D9C8B8] bg-white px-4 py-[15px] text-base text-forest-900 outline-none transition placeholder:text-[#8A7E88] focus:border-accent-500 focus:shadow-[0_0_0_4px_rgba(224,135,63,0.2)]"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="login-password" class="text-[14.5px] font-semibold text-forest-900"
            >Mot de passe</label
          >
          <div
            class="flex items-center rounded-[14px] border-[1.5px] border-[#D9C8B8] bg-white transition focus-within:border-accent-500 focus-within:shadow-[0_0_0_4px_rgba(224,135,63,0.2)]"
          >
            <input
              id="login-password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              class="min-w-0 flex-1 bg-transparent px-4 py-[15px] text-lg tracking-[0.08em] text-forest-900 outline-none"
            />
            <button
              type="button"
              (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="
                showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
              "
              class="px-4 text-[#6B5F68] hover:text-forest-900"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
                @if (showPassword()) {
                  <path d="M4 4l16 16" />
                }
              </svg>
            </button>
          </div>
        </div>

        <div class="-mt-2.5 flex justify-end">
          <a
            routerLink="/set-password"
            class="text-sm font-semibold text-accent-800 hover:underline"
            >Mot de passe oublié ?</a
          >
        </div>

        @if (errorMessage()) {
          <p class="m-0 rounded-lg bg-red-50 px-3.5 py-2.5 text-sm text-red-600" role="alert">
            {{ errorMessage() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="form.invalid || loading()"
          class="rounded-full bg-accent-500 p-[17px] text-center font-display text-[17px] font-bold text-forest-900 transition hover:bg-accent-600 disabled:opacity-50"
        >
          {{ loading() ? 'Connexion…' : 'Se connecter' }}
        </button>

        <p class="m-0 text-center text-[15px] text-[#4A3F49]">
          Pas encore de compte ?
          <a
            routerLink="/register"
            [queryParams]="returnUrl ? { returnUrl } : {}"
            class="font-semibold text-accent-800 underline underline-offset-[3px]"
            >Créer un compte</a
          >
        </p>
      </form>
    </div>
  </div>
</div>
