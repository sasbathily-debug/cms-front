<div class="grid min-h-screen bg-cream-50 lg:grid-cols-2">
  <app-auth-visual-panel />

  <div class="flex items-center justify-center px-4 py-12 sm:px-6">
    <div class="w-full max-w-sm">
      <div class="mb-10 flex flex-col items-center gap-3 text-center lg:items-start lg:text-left">
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-forest-900 lg:hidden">
          <img src="/logo/logo-icon-light.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
        </div>
        <div>
          <h1 class="font-display text-2xl font-bold text-forest-900">Content de vous revoir</h1>
          <p class="mt-1 text-sm text-ink-600">Connectez-vous à votre espace patient</p>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <div>
          <label class="mb-2 block text-sm font-medium text-ink-900">Email ou téléphone</label>
          <input
            type="text"
            formControlName="identifier"
            autocomplete="username"
            placeholder="vous@exemple.com ou 77 000 00 00"
            class="w-full rounded-xl border border-border-warm bg-white px-4 py-3 text-sm text-ink-900 shadow-sm transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500/20"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-ink-900">Mot de passe</label>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="w-full rounded-xl border border-border-warm bg-white px-4 py-3 text-sm text-ink-900 shadow-sm transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500/20"
          />
        </div>

        @if (errorMessage()) {
          <p class="rounded-lg bg-red-50 px-3.5 py-2.5 text-sm text-red-600">{{ errorMessage() }}</p>
        }

        <button
          type="submit"
          [disabled]="form.invalid || loading()"
          class="w-full rounded-xl bg-accent-500 px-4 py-3.5 font-display text-sm font-semibold text-white shadow-sm transition hover:bg-accent-600 hover:shadow disabled:opacity-50"
        >
          {{ loading() ? 'Connexion...' : 'Se connecter' }}
        </button>

        <p class="text-center text-sm text-ink-600">
          Pas encore de compte ?
          <a
            routerLink="/register"
            [queryParams]="returnUrl ? { returnUrl } : {}"
            class="font-semibold text-accent-600 hover:text-accent-500"
            >Créer un compte</a
          >
        </p>
      </form>
    </div>
  </div>
</div>
