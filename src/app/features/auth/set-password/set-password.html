<div class="flex min-h-screen items-center justify-center bg-cream-50 px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-forest-900">
        <img src="/logo/logo-icon-light.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
      </div>
      <div>
        <h1 class="font-display text-xl font-bold text-forest-900">Choisissez votre mot de passe</h1>
        <p class="text-sm text-ink-600">Dernière étape pour {{ email() }}</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 rounded-2xl bg-white p-6 shadow-sm sm:p-8">
      <div>
        <label for="set-password-password" class="mb-1.5 block text-sm font-medium text-ink-900">Mot de passe</label>
        <input id="set-password-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="w-full rounded-lg border px-3.5 py-2.5 text-sm text-ink-900 focus:outline-none focus:ring-1"
          [class]="
            form.controls.password.invalid && form.controls.password.touched
              ? 'border-red-400 focus:border-red-400 focus:ring-red-400/20'
              : 'border-border-warm focus:border-accent-500 focus:ring-accent-500/20'
          "
        />
        <div class="mt-2 flex items-center gap-1.5 text-xs" [class]="passwordLongEnough() ? 'text-[#2E7D46]' : 'text-ink-600'">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
          8 caractères minimum
        </div>
      </div>

      <div>
        <label for="set-password-confirmPassword" class="mb-1.5 block text-sm font-medium text-ink-900">Confirmer le mot de passe</label>
        <input id="set-password-confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="w-full rounded-lg border px-3.5 py-2.5 text-sm text-ink-900 focus:outline-none focus:ring-1"
          [class]="
            (form.errors?.['passwordsMismatch'] && form.controls.confirmPassword.touched) ||
            (form.controls.confirmPassword.invalid && form.controls.confirmPassword.touched)
              ? 'border-red-400 focus:border-red-400 focus:ring-red-400/20'
              : 'border-border-warm focus:border-accent-500 focus:ring-accent-500/20'
          "
        />
        @if (form.errors?.['passwordsMismatch'] && form.controls.confirmPassword.touched) {
          <p class="mt-1.5 text-xs text-red-600">Les mots de passe ne correspondent pas</p>
        }
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-600">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="form.invalid || loading()"
        class="w-full rounded-full bg-accent-500 px-4 py-3 font-display text-sm font-semibold text-white transition hover:bg-accent-600 disabled:opacity-50"
      >
        {{ loading() ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>
  </div>
</div>
