<div class="grid min-h-svh bg-page lg:grid-cols-2">
  <app-auth-visual-panel />

  <div class="relative flex items-center justify-center px-4 py-14 sm:px-10">
    <a
      routerLink="/"
      class="absolute right-5 top-6 text-[14.5px] font-semibold text-body hover:text-fg sm:right-10 sm:top-8"
      >← Retour à l'accueil</a
    >

    <div class="flex w-full max-w-[440px] flex-col gap-[26px]">
      <app-auth-steps [step]="3" />

      <div class="flex flex-col gap-2">
        <h1
          class="m-0 font-display text-[34px] font-bold leading-[1.1] tracking-[-0.025em] text-fg"
        >
          Choisissez votre mot de passe
        </h1>
        <p class="m-0 text-base leading-[1.55] text-body">
          Dernière étape pour <strong class="text-fg">{{ recipient() }}</strong>
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-[26px]">
        <div class="flex flex-col gap-2">
          <label for="set-password-password" class="text-[14.5px] font-semibold text-fg"
            >Mot de passe</label
          >
          <div
            class="flex items-center rounded-[14px] border-[1.5px] bg-surface transition focus-within:border-accent-500"
            [class]="
              form.controls.password.invalid && form.controls.password.touched
                ? 'border-danger'
                : 'border-line-strong'
            "
          >
            <input
              id="set-password-password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              class="min-w-0 flex-1 bg-transparent px-4 py-[15px] text-lg tracking-[0.08em] text-fg outline-none"
            />
            <button
              type="button"
              (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="
                showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
              "
              class="px-4 text-muted hover:text-fg"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
                @if (showPassword()) {
                  <path d="M4 4l16 16" />
                }
              </svg>
            </button>
          </div>
          <span
            class="flex items-center gap-2 text-[13px]"
            [class]="passwordLongEnough() ? 'text-success' : 'text-muted'"
          >
            <span
              class="flex h-[18px] w-[18px] items-center justify-center rounded-full"
              [class]="passwordLongEnough() ? 'bg-success-solid' : 'bg-line-strong'"
            >
              <svg
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--color-white)"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12l5 5 9-10" />
              </svg>
            </span>
            8 caractères minimum
          </span>
        </div>

        <div class="flex flex-col gap-2">
          <label for="set-password-confirmPassword" class="text-[14.5px] font-semibold text-fg"
            >Confirmer le mot de passe</label
          >
          <div
            class="flex items-center rounded-[14px] border-[1.5px] bg-surface transition focus-within:border-accent-500"
            [class]="
              form.errors?.['passwordsMismatch'] && form.controls.confirmPassword.touched
                ? 'border-danger'
                : 'border-line-strong'
            "
          >
            <input
              id="set-password-confirmPassword"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              class="min-w-0 flex-1 bg-transparent px-4 py-[15px] text-lg tracking-[0.08em] text-fg outline-none"
            />
          </div>
          @if (form.errors?.['passwordsMismatch'] && form.controls.confirmPassword.touched) {
            <p class="m-0 text-[13px] text-danger">Les mots de passe ne correspondent pas</p>
          }
        </div>

        @if (errorMessage()) {
          <p class="m-0 text-sm text-danger" role="alert">{{ errorMessage() }}</p>
        }

        <button
          type="submit"
          [disabled]="form.invalid || loading()"
          class="rounded-full bg-accent-500 p-[17px] text-center font-display text-[17px] font-bold text-on-accent transition hover:bg-accent-600 disabled:opacity-50"
        >
          {{ loading() ? 'Création…' : 'Terminer et accéder à mon espace' }}
        </button>
      </form>
    </div>
  </div>
</div>
