<div class="flex min-h-screen bg-cream-50">
  <ng-template #navLinks>
    <nav class="flex flex-col gap-1">
      <div class="mb-1 px-3.5 pt-1 text-[10.5px] font-semibold uppercase tracking-wide text-[#7A6B7D]">Activité</div>
      <a
        routerLink="/admin/appointments"
        routerLinkActive="bg-white/10 text-white font-semibold"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-medium text-[#C9BFCB]"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" /></svg>
        <span>Rendez-vous</span>
      </a>
      <a
        routerLink="/admin/availability"
        routerLinkActive="bg-white/10 text-white font-semibold"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-medium text-[#C9BFCB]"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" /></svg>
        <span>Agenda</span>
      </a>
      <a
        routerLink="/admin/documents"
        routerLinkActive="bg-white/10 text-white font-semibold"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-medium text-[#C9BFCB]"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5a1 1 0 001 1h5" /><path d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z" /></svg>
        <span>Documents</span>
      </a>

      <div class="mb-1 mt-4 px-3.5 text-[10.5px] font-semibold uppercase tracking-wide text-[#7A6B7D]">Contenu du site</div>
      <a
        routerLink="/admin/services"
        routerLinkActive="bg-white/10 text-white font-semibold"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-medium text-[#C9BFCB]"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
        <span>Services</span>
      </a>
      <a
        routerLink="/admin/health-tips"
        routerLinkActive="bg-white/10 text-white font-semibold"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-medium text-[#C9BFCB]"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c3.5 4.4 6.5 8.4 6.5 11.7a6.5 6.5 0 11-13 0c0-3.3 3-7.3 6.5-11.7z" /></svg>
        <span>Conseils santé</span>
      </a>
      <a
        routerLink="/admin/faq"
        routerLinkActive="bg-white/10 text-white font-semibold"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-medium text-[#C9BFCB]"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M9.5 9a2.5 2.5 0 114 2c-.6.6-1.5 1-1.5 2.2M12 17h.01" /></svg>
        <span>FAQ</span>
      </a>
      <a
        routerLink="/admin/settings"
        routerLinkActive="bg-white/10 text-white font-semibold"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-medium text-[#C9BFCB]"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 00-1.7-1L15 3.5h-6l-.4 2.5a7.6 7.6 0 00-1.7 1l-2.3-.9-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.75 1.7 1l.4 2.5h6l.4-2.5c.6-.25 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5z" /></svg>
        <span>Réglages du site</span>
      </a>
    </nav>
  </ng-template>

  <aside class="hidden w-64 shrink-0 flex-col overflow-y-auto bg-forest-900 p-5 md:sticky md:top-0 md:flex md:h-screen md:self-start">
    <a routerLink="/" class="mb-5 flex items-center gap-3 border-b border-white/10 px-1 pb-5">
      <span class="flex h-[38px] w-[38px] shrink-0 items-center justify-center rounded-full bg-accent-500">
        <img src="/logo/logo-icon-dark.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
      </span>
      <span>
        <span class="block font-display text-sm font-bold text-white">Dr Fall</span>
        <span class="block text-[11.5px] text-[#9993A0]">Espace pro</span>
      </span>
    </a>

    <ng-container [ngTemplateOutlet]="navLinks" />

    <div class="mt-auto flex items-center gap-2.5 border-t border-white/10 pt-[18px]">
      <a routerLink="/profile" class="flex min-w-0 flex-1 items-center gap-2.5">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-accent-100">
          <img src="/logo/logo-icon-dark.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
        </span>
        <span class="min-w-0 flex-1 truncate text-sm font-semibold text-white">Mon profil</span>
      </a>
      <button
        type="button"
        (click)="logout()"
        title="Déconnexion"
        aria-label="Se déconnecter"
        class="shrink-0 text-[#9993A0]"
      >
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" /></svg>
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <div class="sticky top-0 z-30 md:hidden">
      <div class="flex items-center justify-between border-b border-border-warm bg-white px-4 py-3.5">
        <a routerLink="/" class="flex items-center gap-2.5">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-forest-900">
            <img src="/logo/logo-icon-light.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
          </span>
          <span class="font-display text-sm font-bold text-forest-900">Espace pro</span>
        </a>
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="flex h-9 w-9 items-center justify-center rounded-full border border-border-warm text-forest-900"
          aria-label="Ouvrir le menu"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
      </div>

      @if (mobileMenuOpen()) {
        <div class="max-h-[calc(100vh-4rem)] overflow-y-auto border-b border-border-warm bg-forest-900 p-4">
          <ng-container [ngTemplateOutlet]="navLinks" />
          <div class="mt-3 flex items-center gap-3 border-t border-white/10 pt-3">
            <a routerLink="/profile" (click)="closeMobileMenu()" class="flex-1 text-sm font-semibold text-white">Mon profil</a>
            <button type="button" (click)="logout()" class="text-sm font-medium text-[#C9BFCB]">Déconnexion</button>
          </div>
        </div>
      }
    </div>

    <main class="flex-1 overflow-auto px-4 py-8 sm:px-8 sm:py-10">
      <router-outlet />
    </main>
  </div>
</div>
