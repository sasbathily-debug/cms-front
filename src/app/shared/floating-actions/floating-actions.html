<a
  [href]="site.telHref()"
  aria-label="Appeler le cabinet"
  class="call-btn fixed bottom-5 left-4 z-40 flex h-16 w-16 items-center justify-center rounded-full bg-accent-500 sm:bottom-7 sm:left-7 sm:h-[88px] sm:w-[88px]"
>
  <svg class="call-ico h-7 w-7 sm:h-10 sm:w-10" viewBox="0 0 24 24" fill="none" stroke="#1F1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" />
  </svg>
</a>
@if (site.whatsappHref()) {
  <a
    [href]="site.whatsappHref()"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Écrire sur WhatsApp"
    class="fixed bottom-6 right-4 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-[#1F9D55] shadow-[0_14px_30px_rgba(0,0,0,0.3)] sm:bottom-8 sm:right-7 sm:h-[72px] sm:w-[72px]"
  >
    <svg class="h-6 w-6 sm:h-8 sm:w-8" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6L3 21z" />
    </svg>
  </a>
}
