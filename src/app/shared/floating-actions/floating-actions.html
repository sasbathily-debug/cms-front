@if (showCircles()) {
  <!-- Ordinateur : deux boutons ronds, appel à gauche et WhatsApp à droite. -->
  <a
    [href]="site.telHref()"
    aria-label="Appeler le cabinet"
    class="call-btn cookie-lift-left fixed bottom-7 left-7 z-40 hidden h-[88px] w-[88px] items-center justify-center rounded-full bg-accent-500 shadow-[0_18px_36px_rgba(0,0,0,0.35)] lg:flex"
  >
    <svg
      class="h-10 w-10"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--color-plum-900)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"
      />
    </svg>
  </a>
  @if (site.whatsappHref()) {
    <a
      [href]="site.whatsappHref()"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Écrire sur WhatsApp"
      class="cookie-lift fixed bottom-8 right-7 z-40 hidden h-[72px] w-[72px] items-center justify-center rounded-full bg-success-solid shadow-[0_14px_30px_rgba(0,0,0,0.3)] lg:flex"
    >
      <svg
        class="h-8 w-8"
        viewBox="0 0 24 24"
        fill="none"
        stroke="var(--color-white)"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6L3 21z" />
      </svg>
    </a>
  }
}

<!-- Téléphone : une seule barre fixe, au lieu de trois ronds qui flottent sur le texte. -->
@if (showBar()) {
  <div
    class="fixed inset-x-0 bottom-0 z-40 flex items-center gap-3 border-t border-white/10 bg-[rgba(31,18,38,0.96)] px-4 pb-[max(12px,env(safe-area-inset-bottom))] pt-3 lg:hidden"
  >
    <a
      routerLink="/rendez-vous"
      class="btn-arrow flex-1 rounded-full bg-accent-500 px-5 py-3.5 text-center font-display text-[15px] font-bold text-on-accent"
      ><span class="btn-label">Prendre rendez-vous</span></a
    >
    <a
      [href]="site.telHref()"
      aria-label="Appeler le cabinet"
      class="flex h-[50px] w-[50px] shrink-0 items-center justify-center rounded-full border-[1.5px] border-peach text-peach"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"
        />
      </svg>
    </a>
    @if (site.whatsappHref()) {
      <a
        [href]="site.whatsappHref()"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Écrire sur WhatsApp"
        class="flex h-[50px] w-[50px] shrink-0 items-center justify-center rounded-full border-[1.5px] border-peach text-peach"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6L3 21z" />
        </svg>
      </a>
    }
  </div>
}
