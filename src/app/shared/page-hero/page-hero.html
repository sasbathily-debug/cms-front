<section
  class="relative bg-plum-900 px-4 pb-36 pt-12 sm:px-6 sm:pt-16 lg:px-10 lg:pb-[190px] lg:pt-[72px]"
>
  <div
    class="mx-auto grid max-w-[1160px] items-start gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,520px)] lg:gap-14"
  >
    <div class="flex flex-col gap-5">
      <nav
        aria-label="Fil d'Ariane"
        class="flex flex-wrap gap-x-2.5 text-[13.5px] text-on-plum-muted"
      >
        @for (crumb of crumbs(); track crumb.label; let last = $last) {
          @if (crumb.route && !last) {
            <a [routerLink]="crumb.route" class="text-on-plum-muted hover:text-white">{{
              crumb.label
            }}</a>
            <span aria-hidden="true">/</span>
          } @else {
            <span class="text-white">{{ crumb.label }}</span>
          }
        }
      </nav>
      <h1
        class="m-0 max-w-[580px] text-balance font-display text-[2.4rem] font-bold leading-[1.02] tracking-[-0.035em] text-white sm:text-5xl lg:text-[56px] xl:text-[62px]"
      >
        {{ displayTitle() }}
      </h1>
      @if (lead()) {
        <p class="m-0 max-w-[540px] text-[17px] leading-[1.65] text-on-plum-muted sm:text-[19px]">
          {{ lead() }}
        </p>
      }
      <ng-content select="[actions]" />
    </div>
    <div class="w-full lg:pt-2">
      <ng-content select="[aside]" />
    </div>
  </div>
</section>
