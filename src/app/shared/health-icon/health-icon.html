<svg
  [attr.width]="size()"
  [attr.height]="size()"
  [style.color]="color()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.6"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @switch (resolved()) {
    @case ('droplet') {
      <path d="M12 2.5c3.5 4.4 6.5 8.4 6.5 11.7a6.5 6.5 0 11-13 0c0-3.3 3-7.3 6.5-11.7z" />
    }
    @case ('gauge') {
      <path d="M4 16a8 8 0 1116 0" />
      <path d="M12 16l4-4" />
      <circle cx="12" cy="16" r="1.1" fill="currentColor" stroke="none" />
    }
    @case ('molecule') {
      <circle cx="6" cy="7" r="2.2" /><circle cx="18" cy="7" r="2.2" /><circle cx="12" cy="17" r="2.2" />
      <path d="M7.7 8.6L10.5 15M16.3 8.6L13.5 15M8.2 7h7.6" />
    }
    @case ('heart') {
      <path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z" />
    }
    @case ('activity') {
      <path d="M3 12h4l2 7 4-14 2 7h6" />
    }
    @case ('brain') {
      <path
        d="M9 4a3 3 0 00-3 3 3 3 0 00-1.5 5.6A3 3 0 007 18a3 3 0 003 2.5M9 4v14.5M9 4a3 3 0 013-2M15 4a3 3 0 013 3 3 3 0 011.5 5.6A3 3 0 0117 18a3 3 0 01-3 2.5M15 4v14.5M15 4a3 3 0 00-3-2"
      />
    }
    @case ('eye') {
      <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
      <circle cx="12" cy="12" r="2.8" />
    }
    @case ('bone') {
      <path
        d="M6.5 9.8a2.1 2.1 0 10-2.9 3l8.6 8.6a2.1 2.1 0 103-2.9L6.5 9.8z"
      />
      <path
        d="M17.5 14.2a2.1 2.1 0 102.9-3l-8.6-8.6a2.1 2.1 0 10-3 2.9l8.7 8.7z"
      />
    }
    @case ('pill') {
      <rect x="3.5" y="9.2" width="17" height="7" rx="3.5" transform="rotate(-30 12 12)" />
      <path d="M11 7.5l2 9" transform="rotate(-30 12 12)" />
    }
    @case ('stethoscope') {
      <path d="M6 3v6a4 4 0 008 0V3" />
      <path d="M10 13v2.5a5 5 0 0010 0V13" />
      <circle cx="20" cy="11.5" r="1.4" />
    }
    @case ('shield') {
      <path d="M12 3l7 3.2v5.3c0 4.6-3 7.8-7 9-4-1.2-7-4.4-7-9V6.2L12 3z" />
    }
    @case ('leaf') {
      <path d="M5 20c8 0 14-6 14-14V4h-2C9 4 5 10 5 18v2z" />
      <path d="M5 20c2-4 5-7 9-9" />
    }
    @default {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 8v8M8 12h8" />
    }
  }
</svg>
