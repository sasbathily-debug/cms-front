<div
  class="relative hidden h-full flex-col justify-between overflow-hidden p-12 lg:flex"
  style="background: linear-gradient(155deg, #34203c 0%, #1f1226 100%)"
>
  <div class="pointer-events-none absolute inset-0 opacity-[0.07]">
    <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <path
        d="M0 620h60l16-70 22 140 18-90 14 30h270"
        fill="none"
        stroke="#FBF5EE"
        stroke-width="2"
      />
      <circle cx="120" cy="180" r="90" fill="none" stroke="#FBF5EE" stroke-width="1.5" />
      <circle cx="320" cy="720" r="60" fill="none" stroke="#FBF5EE" stroke-width="1.5" />
    </svg>
  </div>

  <a routerLink="/" class="relative flex items-center gap-3">
    <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-accent-500">
      <img src="/logo/logo-icon-dark.png" alt="Logo" class="h-2/3 w-2/3 object-contain" />
    </span>
    <span class="leading-tight">
      <span class="block font-display text-base font-bold text-white"
        >Dr Aissatou Mamadou Fall</span
      >
      <span class="block text-xs text-[#C9BFCB]">Endocrinologie &amp; Nutrition</span>
    </span>
  </a>

  <div class="relative max-w-md">
    <h2
      class="mb-5 font-display text-[2.6rem] font-bold leading-[1.05] tracking-[-0.025em] text-white"
    >
      Suivez votre santé, à votre rythme.
    </h2>
    <p class="mb-8 text-[17px] leading-relaxed text-[#E8DACE]">
      Votre espace patient réunit vos rendez-vous, vos rappels et vos documents, au même endroit.
    </p>

    <ul class="m-0 flex list-none flex-col gap-3.5 p-0">
      @for (point of points; track point) {
        <li class="flex items-center gap-3.5 text-[17px] text-[#F3EAE0]">
          <span
            class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-accent-500"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1F1226"
              stroke-width="3.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </span>
          {{ point }}
        </li>
      }
    </ul>
  </div>

  <span class="relative text-sm text-[#D8C9BB]"
    >Besoin d'aide ? Appelez le <strong class="text-white">{{ site.phone() }}</strong></span
  >
</div>
