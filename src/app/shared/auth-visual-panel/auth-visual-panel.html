<div
  class="relative hidden h-full flex-col justify-between overflow-y-auto p-14 text-white lg:flex"
  style="
    background:
      linear-gradient(
        180deg,
        rgba(31, 18, 38, 0.78) 0%,
        rgba(31, 18, 38, 0.55) 45%,
        rgba(31, 18, 38, 0.94) 100%
      ),
      url('/img/auth-photo.jpg') 62% center / cover;
  "
>
  <a routerLink="/">
    <img
      src="/logo/logo-full-light.png"
      alt="Cabinet d'Endocrinologie, Diabétologie & Nutrition — Dr Aïssatou Mamadou Fall"
      class="block h-auto w-[290px]"
    />
  </a>

  <div class="flex max-w-[480px] flex-col gap-[26px]">
    <h2 class="m-0 font-display text-[46px] font-bold leading-[1.05] tracking-[-0.03em]">
      Suivez votre santé, à votre rythme.
    </h2>
    <p class="m-0 text-[17.5px] leading-[1.6] text-[#E8DACE]">
      Votre espace patient réunit vos rendez-vous, vos rappels et vos documents, au même endroit.
    </p>
    <ul class="m-0 mt-1.5 flex list-none flex-col gap-3.5 p-0">
      @for (point of points; track point) {
        <li class="flex items-center gap-3.5 text-[17px] text-[#F3EAE0]">
          <span
            class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-accent-500"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1F1226"
              stroke-width="3.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12l5 5 9-10" />
            </svg>
          </span>
          {{ point }}
        </li>
      }
    </ul>
  </div>

  <span class="text-[14.5px] text-[#D8C9BB]"
    >Besoin d'aide ? Appelez le <strong class="text-white">{{ site.phone() }}</strong></span
  >
</div>
