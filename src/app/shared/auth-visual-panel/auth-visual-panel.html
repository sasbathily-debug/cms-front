<!-- Téléphone : un petit portrait rond et la phrase, puis le formulaire -->
<div class="flex items-center gap-4 bg-plum-900 px-5 py-5 text-white lg:hidden">
  <img
    src="/img/dr-fall-sourire-640.webp"
    alt="Le Dr Aïssatou Mamadou Fall"
    width="72"
    height="72"
    class="h-[72px] w-[72px] shrink-0 rounded-full border-2 border-accent-500 bg-plum-800 object-cover object-[50%_25%]"
  />
  <div class="flex flex-col gap-0.5">
    <p class="m-0 font-display text-[22px] font-bold leading-tight tracking-[-0.02em]">
      {{ phrase() }}
    </p>
    <span class="text-[14px] text-on-plum-muted">Dr Aïssatou Mamadou Fall</span>
  </div>
</div>

<!-- Ordinateur : le portrait, laissé libre, et le texte posé dessous -->
<div
  class="relative hidden h-full flex-col justify-between overflow-y-auto p-14 text-white lg:flex"
  style="
    background:
      linear-gradient(
        180deg,
        rgba(31, 18, 38, 0.35) 0%,
        rgba(31, 18, 38, 0) 22%,
        rgba(31, 18, 38, 0) 34%,
        rgba(31, 18, 38, 0.8) 46%,
        #1f1226 59%
      ),
      url('/img/dr-fall-sourire.webp') top center / 100% auto no-repeat,
      #1f1226;
  "
>
  <a routerLink="/">
    <img
      src="/logo/logo-full-light.png"
      alt="Cabinet d'Endocrinologie, Diabétologie & Nutrition — Dr Aïssatou Mamadou Fall"
      class="block h-auto w-[190px]"
    />
  </a>

  <div class="flex max-w-[480px] flex-col gap-7">
    <div class="flex flex-col gap-3">
      <h2 class="m-0 font-display text-[38px] font-bold leading-[1.08] tracking-[-0.03em]">
        {{ phrase() }}
      </h2>
      <span class="text-[16px] text-on-plum-muted">— Dr Aïssatou Mamadou Fall</span>
    </div>
    <div class="flex flex-col gap-2 border-t border-white/20 pt-5">
      <span class="text-xs font-semibold tracking-[0.1em] text-peach">UN CONSEIL DU SUIVI</span>
      <span class="font-display text-[19px] font-semibold leading-snug">{{ conseil.titre }}</span>
      <p class="m-0 text-[15.5px] leading-[1.6] text-on-plum-muted">{{ conseil.texte }}</p>
    </div>
  </div>

  <span class="text-[14.5px] text-on-plum-muted"
    >Besoin d'aide ? Appelez le <strong class="text-white">{{ site.phone() }}</strong></span
  >
</div>
