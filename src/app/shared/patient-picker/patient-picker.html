<div class="relative">
  @if (selected()) {
    <div class="flex items-center justify-between rounded-lg border border-border-warm bg-cream-100 px-3.5 py-2.5">
      <span class="text-sm text-ink-900">{{ selected()!.firstName }} {{ selected()!.lastName }} ({{ selected()!.email }})</span>
      <button type="button" (click)="clear()" class="text-xs font-semibold text-accent-600 hover:text-accent-500">Changer</button>
    </div>
  } @else {
    <input
      type="text"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      placeholder="Rechercher un patient par nom ou email..."
      class="w-full rounded-lg border border-border-warm px-3.5 py-2.5 text-sm focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500"
    />
    @if (open() && results().length > 0) {
      <div class="absolute z-10 mt-1.5 w-full overflow-hidden rounded-lg border border-border-warm bg-white shadow-lg">
        @for (patient of results(); track patient.id) {
          <button
            type="button"
            (mousedown)="pick(patient)"
            class="flex w-full flex-col items-start px-3.5 py-2.5 text-left hover:bg-cream-100"
          >
            <span class="text-sm font-medium text-ink-900">{{ patient.firstName }} {{ patient.lastName }}</span>
            <span class="text-xs text-ink-600">{{ patient.email }}</span>
          </button>
        }
      </div>
    } @else if (open() && query().trim().length > 0) {
      <div class="absolute z-10 mt-1.5 w-full rounded-lg border border-border-warm bg-white p-3.5 text-sm text-ink-600 shadow-lg">
        Aucun patient trouvé.
      </div>
    }
  }
</div>
