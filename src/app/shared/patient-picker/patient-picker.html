<div class="relative">
  @if (selected()) {
    <div
      class="flex items-center justify-between rounded-sm border border-line bg-sunken px-3.5 py-2.5"
    >
      <span class="text-sm text-fg"
        >{{ selected()!.firstName }} {{ selected()!.lastName }} ({{ selected()!.email }})</span
      >
      <button
        type="button"
        (click)="clear()"
        class="text-xs font-semibold text-accent-600 hover:text-accent-500"
      >
        Changer
      </button>
    </div>
  } @else {
    <input
      type="text"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      placeholder="Rechercher un patient par nom ou email..."
      class="w-full rounded-none border border-line px-3.5 py-2.5 text-sm focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500"
    />
    @if (open() && results().length > 0) {
      <div
        class="absolute z-10 mt-1.5 w-full overflow-hidden rounded-none border border-line bg-surface shadow-lg"
      >
        @for (patient of results(); track patient.id) {
          <button
            type="button"
            (mousedown)="pick(patient)"
            class="flex w-full flex-col items-start px-3.5 py-2.5 text-left hover:bg-sunken"
          >
            <span class="text-sm font-medium text-fg"
              >{{ patient.firstName }} {{ patient.lastName }}</span
            >
            <span class="text-xs text-muted">{{ patient.email }}</span>
          </button>
        }
      </div>
    } @else if (open() && query().trim().length > 0) {
      <div
        class="absolute z-10 mt-1.5 w-full rounded-none border border-line bg-surface p-3.5 text-sm text-muted shadow-lg"
      >
        Aucun patient trouvé.
      </div>
    }
  }
</div>
