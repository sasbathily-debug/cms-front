<div
  class="sil-grid mx-auto grid max-w-[1160px] items-center gap-8 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.05fr)] lg:gap-12"
>
  <div
    class="sil-wrap relative flex min-h-[460px] items-center justify-center rounded-[32px] bg-[linear-gradient(160deg,#3A2418_0%,#1F1226_70%)] py-8 sm:min-h-[600px]"
  >
    <div class="relative w-[260px] sm:w-[300px]">
      <img
        src="/img/silhouette.png"
        alt="Silhouette assise du logo du cabinet, avec les glandes endocrines repérées"
        class="block h-auto w-full opacity-90"
      />
      <div class="gl g-hy r" style="left: 50%; top: 18%">
        <span class="dot"></span><span class="line"></span><span class="lab">Hypophyse</span>
      </div>
      <div class="gl g-th l" style="left: 50%; top: 34%">
        <span class="dot"></span><span class="line"></span><span class="lab">Thyroïde</span>
      </div>
      <div class="gl g-fo r" style="left: 59%; top: 45%">
        <span class="dot"></span><span class="line"></span><span class="lab">Foie</span>
      </div>
      <div class="gl g-pa l" style="left: 50%; top: 52%">
        <span class="dot"></span><span class="line"></span><span class="lab">Pancréas</span>
      </div>
      <div class="gl g-su r" style="left: 50%; top: 60%">
        <span class="dot"></span><span class="line"></span><span class="lab">Surrénales</span>
      </div>
      <div class="gl g-ov l" style="left: 50%; top: 68%">
        <span class="dot"></span><span class="line"></span
        ><span class="lab">Ovaires et testicules</span>
      </div>
    </div>
    <span class="absolute bottom-[18px] left-6 text-[12.5px] text-[#B5A9B8]"
      >Schéma simplifié, pas une carte anatomique.</span
    >
  </div>
  <div class="flex flex-col gap-[22px]">
    <span class="text-xs font-semibold tracking-[0.12em] text-accent-700">{{ eyebrow() }}</span>
    <h2
      class="m-0 font-display text-[2rem] font-bold leading-[1.08] tracking-[-0.025em] text-forest-900 sm:text-[44px]"
    >
      {{ title() }}
    </h2>
    <p class="m-0 text-[17px] leading-[1.65] text-[#4A3F49]">{{ intro() }}</p>
    <div class="mt-1 flex flex-col gap-2.5">
      @for (row of rows; track row.key) {
        <a
          [routerLink]="row.route"
          [class]="'row row-' + row.key"
          class="flex items-center gap-4 rounded-[18px] border border-border-warm bg-cream-50 px-[18px] py-3.5 text-forest-900"
        >
          <span
            class="flex h-[46px] w-[46px] shrink-0 items-center justify-center rounded-[14px] bg-forest-900 font-display text-[17px] font-bold text-[#F1C99B]"
            >{{ row.sym }}</span
          >
          <span class="flex min-w-0 flex-1 flex-col gap-0.5">
            <span class="font-display text-lg font-bold">{{ row.title }}</span>
            @if (detailed()) {
              <span class="text-sm leading-snug text-[#4A3F49]">{{ row.text }}</span>
            }
            <span class="text-sm text-ink-600">{{ row.organ }}</span>
          </span>
          @if (detailed()) {
            <span aria-hidden="true" class="shrink-0 text-xl text-accent-700">→</span>
          }
        </a>
      }
    </div>
  </div>
</div>
