<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Dr Aissatou Mamadou Fall – Endocrinologue à Dakar</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cabinet du Dr Aissatou Mamadou Fall, endocrinologue à Dakar (Sacré-Cœur) : diabète, troubles métaboliques et hormonaux. Prenez rendez-vous en ligne."
    />
    <meta name="theme-color" content="#1f1226" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="logo/logo-icon-light.png" />
    <link rel="apple-touch-icon" href="logo/logo-icon-light.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Dr Aissatou Mamadou Fall" />
    <meta property="og:title" content="Dr Aissatou Mamadou Fall – Endocrinologue à Dakar" />
    <meta
      property="og:description"
      content="Diabète, troubles métaboliques et hormonaux. Prenez rendez-vous en ligne avec le Dr Fall, à Sacré-Cœur, Dakar."
    />
    <meta property="og:image" content="https://draissatoumamadou.com/logo/logo-icon-light.png" />
  </head>
  <body>
    <app-root>
      <style>
        #app-boot-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fbf5ee;
        }
        #app-boot-loader .badge {
          display: flex;
          height: 56px;
          width: 56px;
          align-items: center;
          justify-content: center;
          border-radius: 9999px;
          background: #1f1226;
          animation: app-boot-pulse 1.4s ease-in-out infinite;
        }
        #app-boot-loader img {
          height: 28px;
          width: 28px;
        }
        @keyframes app-boot-pulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 1;
          }
          50% {
            transform: scale(1.08);
            opacity: 0.75;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #app-boot-loader .badge {
            animation: none;
          }
        }
      </style>
      <div id="app-boot-loader">
        <div class="badge">
          <img src="/logo/logo-icon-light.png" alt="" />
        </div>
      </div>
    </app-root>
  </body>
</html>
